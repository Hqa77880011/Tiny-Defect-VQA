[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-defect-vqa"
version = "0.1.0"
description = "Tiny Defect-VQA: Mask-Grounded Edge Visual Question Answering for Industrial Surface Inspection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
tiny-defect-vqa = "tiny_defect_vqa.cli:main"

[tool.setuptools.packages.find]
include = ["tiny_defect_vqa*"]
